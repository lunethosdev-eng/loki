name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
        {
          echo "storeFile=bitchord-release.jks"
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
          echo "keyAlias=${{ secrets.KEY_ALIAS }}"
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
        } > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Phone APK only — do not fail the whole job if Wear packaging breaks (keystore, etc.)
    - name: Build Signed Prod Release APK (phone)
      run: ./gradlew :app:assembleProdRelease

    - name: Upload phone APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pokke-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk
        if-no-files-found: warn

    - name: Build Wear OS APK (optional)
      continue-on-error: true
      run: ./gradlew :wearos:assembleProdRelease

    - name: Upload Wear OS APK Artifact
      if: success() || failure()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: pokke-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk
        if-no-files-found: ignore
